services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-in-production}
      DATABASE_PATH: /app/data/toasty-to-do.sqlite
    ports:
      - '${PORT:-3000}:3000'
    restart: unless-stopped
    volumes:
      - toasty_data:/app/data

volumes:
  toasty_data:
